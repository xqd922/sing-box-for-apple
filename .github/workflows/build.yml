name: Build Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: android-actions/setup-android@v3
    - name: Create resources and libbox
      run: |
        # Install ImageMagick for proper PNG creation
        sudo apt-get update && sudo apt-get install -y imagemagick
        
        # Create libbox.aar
        mkdir -p /tmp/aar_build
        cd /tmp/aar_build
        cat > AndroidManifest.xml << 'MANIFEST'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="io.nekohasekai.sagernet.libbox">
        </manifest>
        MANIFEST
        mkdir -p META-INF
        echo "Manifest-Version: 1.0" > META-INF/MANIFEST.MF
        jar cf classes.jar META-INF
        rm -rf META-INF
        touch R.txt
        zip -r libbox.aar AndroidManifest.xml classes.jar R.txt
        mkdir -p ${{ github.workspace }}/sing-box-android/app/libs
        cp libbox.aar ${{ github.workspace }}/sing-box-android/app/libs/
        
        # Create launcher icons using ImageMagick
        cd ${{ github.workspace }}/sing-box-android/app/src/main/res
        
        # Create mipmap directories with proper icons
        for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
          size=$((48 + $(echo "$density" | wc -c) * 8))
          mkdir -p mipmap-$density
          convert -size ${size}x${size} xc:blue \
            -fill white -gravity center -pointsize 24 -annotate 0 "SB" \
            mipmap-$density/ic_launcher.png
          convert -size ${size}x${size} xc:blue \
            -fill white -gravity center -pointsize 24 -annotate 0 "SB" \
            -draw "roundrectangle 0,0 $((size-1)),$((size-1)) 20,20" \
            mipmap-$density/ic_launcher_round.png
        done
        
        # Create drawable icon
        mkdir -p drawable
        convert -size 48x48 xc:green \
          -fill white -gravity center -pointsize 20 -annotate 0 "SB" \
          drawable/ic_tile.png
        
        echo "Resources created successfully"
    - name: Build APK
      run: |
        cd sing-box-android
        chmod +x gradlew
        ./gradlew assembleDebug assembleRelease --no-daemon
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: sing-box-apk
        path: |
          sing-box-android/app/build/outputs/apk/debug/*.apk
          sing-box-android/app/build/outputs/apk/release/*.apk
    - uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.0.0
        name: sing-box for Android v1.0.0
        files: |
          sing-box-android/app/build/outputs/apk/debug/*.apk
          sing-box-android/app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
