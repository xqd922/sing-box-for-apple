name: Build Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: android-actions/setup-android@v3
    - name: Create proper libbox.aar
      run: |
        mkdir -p /tmp/aar_build
        cd /tmp/aar_build
        
        # Create AndroidManifest.xml
        cat > AndroidManifest.xml << 'MANIFEST'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="io.nekohasekai.sagernet.libbox">
        </manifest>
        MANIFEST
        
        # Create classes.jar (empty)
        mkdir -p META-INF
        echo "Manifest-Version: 1.0" > META-INF/MANIFEST.MF
        jar cf classes.jar META-INF
        rm -rf META-INF
        
        # Create R.txt (empty)
        touch R.txt
        
        # Create AAR
        zip -r libbox.aar AndroidManifest.xml classes.jar R.txt
        
        # Copy to project
        mkdir -p ${{ github.workspace }}/sing-box-android/app/libs
        cp libbox.aar ${{ github.workspace }}/sing-box-android/app/libs/
    - name: Build APK
      run: |
        cd sing-box-android
        chmod +x gradlew
        ./gradlew assembleDebug assembleRelease --no-daemon
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: sing-box-apk
        path: |
          sing-box-android/app/build/outputs/apk/debug/*.apk
          sing-box-android/app/build/outputs/apk/release/*.apk
    - uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.0.0
        name: sing-box for Android v1.0.0
        files: |
          sing-box-android/app/build/outputs/apk/debug/*.apk
          sing-box-android/app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
