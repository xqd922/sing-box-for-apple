name: Build Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: android-actions/setup-android@v3
    - run: |
        mkdir -p sing-box-android/app/libs
        cd sing-box-android/app/libs
        mkdir -p META-INF
        echo "Manifest-Version: 1.0" > META-INF/MANIFEST.MF
        zip -r libbox.aar META-INF
        rm -rf META-INF
    - run: |
        cd sing-box-android
        chmod +x gradlew
        ./gradlew assembleDebug assembleRelease --no-daemon
    - uses: actions/upload-artifact@v4
      with:
        name: sing-box-apk
        path: |
          sing-box-android/app/build/outputs/apk/debug/*.apk
          sing-box-android/app/build/outputs/apk/release/*.apk
    - uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.0.0
        name: sing-box for Android v1.0.0
        files: |
          sing-box-android/app/build/outputs/apk/debug/*.apk
          sing-box-android/app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
